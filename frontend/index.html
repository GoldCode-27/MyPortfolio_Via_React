<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Workineh Chalachew, featuring school management, city administration HRM, e-bid, and hostel management systems."
    />
    <meta name="theme-color" content="#f7f7f7" />
    <title>Workineh Chalachew | Software Developer</title>

    <script>
      (() => {
        const root = document.documentElement
        let mode = 'system'

        try {
          const storedMode = window.localStorage.getItem('theme')
          if (storedMode === 'light' || storedMode === 'dark' || storedMode === 'system') {
            mode = storedMode
          }
        } catch {
          // Use the system preference when browser storage is unavailable.
        }

        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        const resolvedTheme =
          mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode

        root.dataset.theme = resolvedTheme
        root.dataset.themeMode = mode
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          resolvedTheme === 'dark' ? '#0b1220' : '#f7f7f7',
        )
      })()
    </script>

    <!-- Font Awesome (kept from original site) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
      integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
